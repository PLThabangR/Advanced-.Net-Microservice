
# =====================================================
# ADVANCED MICROSERVICES - AZURE DEVOPS CI PIPELINE
# =====================================================

trigger:
  branches:
    include:
      - master

pool:
  vmImage: 'windows-latest'

# =====================================================
# VARIABLES
# =====================================================

variables:
  buildConfiguration: 'Release'

  packageOutputPath: '$(Build.ArtifactStagingDirectory)/packages'

  majorVersion: 1
  minorVersion: 0
  patchVersion: $[counter(variables['Build.SourceBranchName'], 0)]

  packageVersion: '$(majorVersion).$(minorVersion).$(patchVersion)'

name: $(packageVersion)

# =====================================================
# STAGES
# =====================================================

stages:

# =====================================================
# STAGE 1: BUILD AND PUBLISH
# =====================================================

- stage: BuildAndPublish
  displayName: 'Build and Publish AuthLibrary'

  jobs:

  - job: Build
    displayName: 'Build AuthLibrary Package'

    steps:

    # 1. Install .NET 8 SDK
    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.x'

    # 2. Restore NuGet Packages
    - task: DotNetCoreCLI@2
      displayName: 'Restore NuGet Packages'
      inputs:
        command: 'restore'
        projects: 'AuthLibrary/AuthLibrary.csproj'

    # 3. Build AuthLibrary
    - task: DotNetCoreCLI@2
      displayName: 'Build AuthLibrary'
      inputs:
        command: 'build'
        projects: 'AuthLibrary/AuthLibrary.csproj'
        arguments: >
          --configuration $(buildConfiguration)
          --no-restore
          -p:GeneratePackageOnBuild=false

    # 4. Package AuthLibrary
    - task: DotNetCoreCLI@2
      displayName: 'Create NuGet Package'
      inputs:
        command: 'pack'
        packagesToPack: 'AuthLibrary/AuthLibrary.csproj'
        versioningScheme: 'off'
        arguments: >
          --configuration $(buildConfiguration)
          --no-build
          --output $(packageOutputPath)
          -p:PackageVersion=$(packageVersion)

    # 5. Publish Pipeline Artifact
    - task: PublishPipelineArtifact@1
      displayName: 'Publish AuthLibrary Artifact'
      inputs:
        targetPath: '$(packageOutputPath)'
        artifact: 'AuthLibrary'
        publishLocation: 'pipeline'
