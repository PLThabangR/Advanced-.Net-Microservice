
# =====================================================
# ADVANCED .NET MICROSERVICES
# Azure DevOps CI/CD Pipeline
# AuthLibrary NuGet Packages
# =====================================================
#tryagain
trigger:
  branches:
    include:
      - master

pool:
  vmImage: 'windows-latest'

# =====================================================
# VARIABLES
# =====================================================

variables:
  buildConfiguration: 'Release'

  majorVersion: 1
  minorVersion: 0
  patchVersion: $[counter(variables['Build.SourceBranchName'], 0)]

  packageVersion: '$(majorVersion).$(minorVersion).$(patchVersion)'
  packageOutputPath: '$(Build.ArtifactStagingDirectory)/packages'

name: $(packageVersion)

# =====================================================
# STAGES
# =====================================================

stages:

# =====================================================
# STAGE 1: BUILD AND PACKAGE
# =====================================================

- stage: BuildAndPublish
  displayName: 'Build and Package AuthLibrary'

  jobs:
  - job: Build
    displayName: 'Build AuthLibrary'

    steps:

    # Install .NET 8 SDK
    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.x'

    # Restore dependencies
    - task: DotNetCoreCLI@2
      displayName: 'Restore NuGet Packages'
      inputs:
        command: 'restore'
        projects: 'AuthLibrary/AuthLibrary.csproj'

    # Build class library
    - task: DotNetCoreCLI@2
      displayName: 'Build AuthLibrary'
      inputs:
        command: 'build'
        projects: 'AuthLibrary/AuthLibrary.csproj'
        arguments: >
          --configuration $(buildConfiguration)
          --no-restore
          -p:GeneratePackageOnBuild=false

    # Create NuGet package
    - task: DotNetCoreCLI@2
      displayName: 'Pack AuthLibrary'
      inputs:
        command: 'pack'
        packagesToPack: 'AuthLibrary/AuthLibrary.csproj'
        configuration: '$(buildConfiguration)'
        packDirectory: '$(packageOutputPath)'
        versioningScheme: 'off'
        arguments: >
          --no-build
          -p:PackageVersion=$(packageVersion)

    # Verify generated NuGet package
    - powershell: |
        $packagePath = "$(packageOutputPath)"

        Write-Host "Checking package directory: $packagePath"

        if (!(Test-Path $packagePath)) {
            throw "Package directory does not exist: $packagePath"
        }

        $packages = Get-ChildItem -Path $packagePath -Filter "*.nupkg"

        if ($packages.Count -eq 0) {
            throw "No NuGet packages were generated."
        }

        Write-Host "Generated NuGet packages:"
        $packages | ForEach-Object {
            Write-Host $_.FullName
        }
      displayName: 'Verify NuGet Package'

    # Publish package as a pipeline artifact
    - task: PublishPipelineArtifact@1
      displayName: 'Publish NuGet Artifact'
      inputs:
        targetPath: '$(packageOutputPath)'
        artifact: 'AuthLibrary'
        publishLocation: 'pipeline'

# =====================================================
# STAGE 2: PUBLISH TO AZURE ARTIFACTS
# =====================================================

- stage: PublishToFeed
  displayName: 'Publish to Azure Artifacts'

  dependsOn: BuildAndPublish
  condition: succeeded()

  jobs:
  - job: PublishPackage
    displayName: 'Publish AuthLibrary NuGet Package'

    steps:

    # Download package from previous stage
    - task: DownloadPipelineArtifact@2
      displayName: 'Download NuGet Artifact'
      inputs:
        buildType: 'current'
        artifactName: 'AuthLibrary'
        targetPath: '$(Pipeline.Workspace)/AuthLibrary'

    # Push package to private Azure Artifacts feed
    # Authenticate with Azure Artifacts
    - task: NuGetAuthenticate@1
      displayName: 'Authenticate with Azure Artifacts'

    # Push package to Azure Artifacts
    - powershell: |
        $feedUrl = "https://pkgs.dev.azure.com/thabangrakgoropo26/_packaging/MicroservicesFeed/nuget/v3/index.json"
        $packagePath = "$(Pipeline.Workspace)\AuthLibrary"

        Write-Host "Feed URL: $feedUrl"

        $packages = Get-ChildItem -Path $packagePath -Filter "*.nupkg"

        if ($packages.Count -eq 0) {
            throw "No NuGet packages found."
        }

        foreach ($package in $packages) {
            Write-Host "Publishing $($package.Name)"

            dotnet nuget push $package.FullName `
                --source $feedUrl `
                --api-key AzureArtifacts `
                --skip-duplicate

            if ($LASTEXITCODE -ne 0) {
                throw "Failed to publish $($package.Name)"
            }
        }
      displayName: 'Push AuthLibrary to MicroservicesFeed'