
# =====================================================
# AUTH SERVICE - AZURE DEVOPS CI PIPELINE
# =====================================================

trigger:
  branches:
    include:
      - master

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'

  majorVersion: 1
  minorVersion: 0
  patchVersion: $[counter(variables['Build.SourceBranchName'], 0)]

  packageVersion: '$(majorVersion).$(minorVersion).$(patchVersion)'

name: $(packageVersion)

stages:

# =====================================================
# STAGE 1: BUILD AND PUBLISH
# =====================================================

- stage: BuildAndPublish
  displayName: 'Build and Publish Auth Library'

  jobs:

  - job: Build
    displayName: 'Build Auth Class Library'

    steps:

    # 1. Install .NET SDK
    - task: UseDotNet@2
      displayName: 'Install .NET SDK'
      inputs:
        packageType: 'sdk'
        version: '8.x'

    # 2. Restore NuGet Packages
    - task: DotNetCoreCLI@2
      displayName: 'Restore NuGet Packages'
      inputs:
        command: 'restore'
        projects: '**/Auth.csproj'

    # 3. Build Auth Library
    - task: DotNetCoreCLI@2
      displayName: 'Build Auth Library'
      inputs:
        command: 'build'
        projects: '**/Auth.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    # 4. Publish Auth Library
    - task: DotNetCoreCLI@2
      displayName: 'Publish Auth Library'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '**/Auth.csproj'
        arguments: >
          --configuration $(buildConfiguration)
          --no-build
          --output $(Build.ArtifactStagingDirectory)/Auth

    # 5. Publish Pipeline Artifact
    - task: PublishPipelineArtifact@1
      displayName: 'Publish Auth Artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/Auth'
        artifact: 'Auth'
        publishLocation: 'pipeline'
