
# =====================================================
# ADVANCED .NET MICROSERVICES
# Azure DevOps CI/CD Pipeline
# =====================================================

trigger:
  branches:
    include:
      - master

pool:
  vmImage: 'windows-latest'

# =====================================================
# VARIABLES
# =====================================================

variables:
  buildConfiguration: 'Release'

  majorVersion: 1
  minorVersion: 0
  patchVersion: $[counter(variables['Build.SourceBranchName'], 0)]

  packageVersion: '$(majorVersion).$(minorVersion).$(patchVersion)'

  packageOutputPath: '$(Build.ArtifactStagingDirectory)/packages'

name: $(packageVersion)

# =====================================================
# STAGES
# =====================================================

stages:

# =====================================================
# STAGE 1: BUILD AND PACKAGE
# =====================================================

- stage: BuildAndPublish
  displayName: 'Build and Package AuthLibrary'

  jobs:

  - job: Build
    displayName: 'Build AuthLibrary'

    steps:

    # Install .NET SDK
    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.x'

    # Restore dependencies
    - task: DotNetCoreCLI@2
      displayName: 'Restore NuGet Packages'
      inputs:
        command: 'restore'
        projects: 'AuthLibrary/AuthLibrary.csproj'

    # Build class library
    - task: DotNetCoreCLI@2
      displayName: 'Build AuthLibrary'
      inputs:
        command: 'build'
        projects: 'AuthLibrary/AuthLibrary.csproj'
        arguments: >
          --configuration $(buildConfiguration)
          --no-restore
          -p:GeneratePackageOnBuild=false

    # Create NuGet package
    - task: DotNetCoreCLI@2
      displayName: 'Pack AuthLibrary'
      inputs:
        command: 'pack'
        packagesToPack: 'AuthLibrary/AuthLibrary.csproj'
        versioningScheme: 'off'
        arguments: >
          --configuration $(buildConfiguration)
          --no-build
          --output $(packageOutputPath)
          -p:PackageVersion=$(packageVersion)

    # Publish pipeline artifact
    - task: PublishPipelineArtifact@1
      displayName: 'Publish NuGet Artifact'
      inputs:
        targetPath: '$(packageOutputPath)'
        artifact: 'AuthLibrary'
        publishLocation: 'pipeline'

# =====================================================
# STAGE 2: PUBLISH TO AZURE ARTIFACTS
# =====================================================

- stage: PublishToFeed
  displayName: 'Publish to Azure Artifacts'
  dependsOn: BuildAndPublish
  condition: succeeded()

  jobs:

  - job: PublishPackage
    displayName: 'Publish AuthLibrary NuGet Package'

    steps:

    # Download package from previous stage
    - task: DownloadPipelineArtifact@2
      displayName: 'Download NuGet Artifact'
      inputs:
        buildType: 'current'
        artifactName: 'AuthLibrary'
        targetPath: '$(Pipeline.Workspace)/AuthLibrary'

    # Push package to private Azure Artifacts feed
    - task: NuGetCommand@2
      displayName: 'Push AuthLibrary to MicroservicesFeed'
      inputs:
        command: 'push'
        packagesToPush: '$(Pipeline.Workspace)/AuthLibrary/*.nupkg'
        nuGetFeedType: 'internal'
        publishVstsFeed: '$(System.TeamProject)/MicroservicesFeed'
        allowPackageConflicts: true
